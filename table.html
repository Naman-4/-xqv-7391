<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
    table{
    width:100%;
    border-collapse:collapse ;
     color: black;   
    }  
    td,th{
      border: 1px solid black;  
      text-align: center;
      padding: 10px;
    }  
    tr{
        background-color: #313131;
    }
    </style>
</head>
<body>
  <table>
    <tr>
        <th>country</th>
        <th>Countrycode</th>
        <th>email</th>
    </tr>
    <tr>
        <td>India</td>
        <td>In</td>
        <td>india@google.com</td>
    </tr>
    <tr>
        <td>United state of America</td>
        <td>UsA</td>
        <td>usa@google.com</td>
    </tr>
    <tr>
        <td>japan</td>
        <td>jp</td>
        <td>jp@google.com</td>
    </tr>
  </table>
</body>
</html>
